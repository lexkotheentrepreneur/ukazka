<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Dochádzka – ukážka portálu</title>
<style>
:root{
  --ink:#0b0d12;--ink2:#3a4150;--mute:#6b7384;--line:rgba(11,13,18,.08);
  --accent:#1f55d6;--on-accent:#ffffff;--tint:#2f6fe4;--atext:#1f55d6;--danger:#c4291d;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#ffffff;color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;min-height:100%;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(60% 38% at 12% 0%,color-mix(in srgb,var(--accent) 17%,transparent),transparent 72%),
  radial-gradient(48% 34% at 100% 22%,color-mix(in srgb,var(--accent) 11%,transparent),transparent 72%),
  radial-gradient(70% 40% at 40% 105%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 72%),#ffffff}
h1{font-size:34px;line-height:1.06;margin:0 0 6px;font-weight:700;letter-spacing:-.03em}
h2{font-size:20px;margin:0;font-weight:700;letter-spacing:-.02em}
h3.sec{font-size:13px;font-weight:600;color:var(--mute);margin:22px 6px 8px;letter-spacing:.01em}
p{margin:0 0 12px}
.lead{color:var(--mute);font-size:16px}
.wrap{max-width:520px;margin:0 auto;padding:18px 18px 132px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
.ic{width:22px;height:22px;flex:none}

/* sklo */
.glass{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(244,248,255,.52));-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(20,40,90,.05),0 10px 30px rgba(14,34,80,.09),0 1px 3px rgba(14,34,80,.07)}
.card{border-radius:24px;padding:18px}
.group{border-radius:22px;overflow:hidden}

/* tlačidlá */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:18px;border:1px solid rgba(255,255,255,.4);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 78%,#ffffff),var(--accent));color:var(--on-accent);font-weight:600;font-size:17px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 20px color-mix(in srgb,var(--accent) 32%,transparent)}
.btn.dark{background:linear-gradient(180deg,#30353f,#0b0d12);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 20px rgba(11,13,18,.25);color:#fff}
.btn.soft{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(244,248,255,.6));color:var(--ink);border-color:rgba(255,255,255,.85);box-shadow:inset 0 1px 0 #fff,0 6px 18px rgba(14,34,80,.08)}
.btn.danger{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,244,243,.6));color:var(--danger)}
.ibtn{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.85);background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(244,248,255,.6));color:var(--ink);box-shadow:inset 0 1px 0 #fff,0 6px 16px rgba(14,34,80,.1);flex:none}
.ibtn.flat{background:transparent;border-color:transparent;box-shadow:none}
.actions{display:grid;gap:12px;margin-top:20px}

/* logo */
.logo{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:14px;font-weight:700;font-size:20px;letter-spacing:-.02em;flex:none;border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 12px rgba(14,34,80,.14);overflow:hidden}
.logo.has-img{background:#ffffff;border:1px solid var(--line)}
.logo.has-img img{width:100%;height:100%;object-fit:contain;padding:6px}
.logo.xl{width:96px;height:96px;border-radius:28px;font-size:38px}
.logo.xl.has-img img{padding:18px}
.logo.sm.has-img img{padding:5px}
.logo.sm{width:40px;height:40px;border-radius:12px;font-size:17px}
.logo.plus{background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(244,248,255,.6));color:var(--ink);border-color:rgba(255,255,255,.9)}

/* výber firmy */
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em;margin:6px 4px 26px}
.brand i{display:block;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.firm-row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;background:none;border:0;border-top:1px solid var(--line);text-align:left;min-height:72px}
.firm-row:first-child{border-top:0}
.firm-row>.ic{color:var(--mute);margin-left:auto;width:18px;height:18px}
.fr-t{display:grid;min-width:0}
.fr-n{font-weight:600;font-size:17px}
.fr-s{color:var(--mute);font-size:14px}

/* prihlásenie */
.hero{display:grid;justify-items:center;text-align:center;margin:8px 0 26px}
.hero .logo{margin-bottom:16px}
.field{display:grid;gap:6px;font-size:14px;color:var(--mute);font-weight:500}
.field input{width:100%;min-height:54px;border-radius:16px;border:1px solid rgba(11,13,18,.1);background:rgba(255,255,255,.75);padding:12px 16px;font-size:18px;color:var(--ink);box-shadow:inset 0 1px 2px rgba(11,13,18,.05)}
.form{display:grid;gap:16px}
.err{color:var(--danger);font-size:14px;min-height:0}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:18px;background:rgba(11,13,18,.06);--i:0}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/2);border-radius:14px;background:linear-gradient(180deg,#ffffff,rgba(255,255,255,.8));box-shadow:0 2px 8px rgba(14,34,80,.16),inset 0 1px 0 #fff;transform:translateX(calc(var(--i)*100%));transition:transform .38s cubic-bezier(.3,1.25,.5,1)}
.seg button{position:relative;background:none;border:0;min-height:46px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{color:var(--ink)}

/* horná lišta */
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:20;display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;border-radius:26px;margin-bottom:6px}
.bar-t{display:grid;min-width:0}
.bar-n{font-weight:700;font-size:17px;letter-spacing:-.01em}
.bar-s{color:var(--mute);font-size:13px}

/* razítko */
.punch{display:block;margin:6px 0 18px}
.orbwrap{position:relative;width:248px;height:248px;display:grid;place-items:center}
.orbwrap svg{position:absolute;inset:0;width:100%;height:100%}
.track{fill:none;stroke:rgba(11,13,18,.06);stroke-width:8}
.prog{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;stroke-dasharray:741.4;stroke-dashoffset:741.4}
.orb{width:196px;height:196px;border-radius:50%;border:1px solid rgba(255,255,255,.6);display:grid;align-content:center;justify-items:center;gap:2px;color:var(--on-accent);position:relative;overflow:hidden;
  background:radial-gradient(circle at 30% 16%,rgba(255,255,255,.55),transparent 44%),linear-gradient(160deg,color-mix(in srgb,var(--accent) 76%,#ffffff),var(--accent));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -14px 26px rgba(0,0,0,.18),0 20px 44px color-mix(in srgb,var(--accent) 36%,transparent)}
.orb.out{color:#ffffff;background:radial-gradient(circle at 30% 16%,rgba(255,255,255,.34),transparent 44%),linear-gradient(160deg,#323843,#0b0d12);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -14px 26px rgba(0,0,0,.35),0 20px 44px rgba(11,13,18,.32)}
.orb .lab{font-size:16px;font-weight:600;opacity:.92}
.orb .time{font-size:40px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05}
.state{display:flex;justify-content:center;align-items:center;gap:9px;margin:14px 0 12px;font-weight:700;font-size:19px;letter-spacing:-.01em;color:var(--mute)}
.state .dot{width:10px;height:10px;border-radius:50%;background:#9aa3b2}
.state small{font-weight:500;font-size:15px;color:var(--mute)}
.state.in{color:#15803d}
.state.in .dot{background:#22c55e;box-shadow:0 0 0 5px rgba(34,197,94,.22)}
.punch-btn{position:relative;overflow:hidden;width:100%;min-height:118px;border-radius:26px;border:1px solid rgba(255,255,255,.6);display:grid;align-content:center;justify-items:center;gap:2px;color:var(--on-accent);background:radial-gradient(120% 150% at 18% 0%,rgba(255,255,255,.5),transparent 46%),linear-gradient(160deg,color-mix(in srgb,var(--accent) 76%,#ffffff),var(--accent));box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -12px 24px rgba(0,0,0,.16),0 18px 40px color-mix(in srgb,var(--accent) 34%,transparent)}
.punch-btn.out{color:#ffffff;background:radial-gradient(120% 150% at 18% 0%,rgba(255,255,255,.3),transparent 46%),linear-gradient(160deg,#323843,#0b0d12);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -12px 24px rgba(0,0,0,.35),0 18px 40px rgba(11,13,18,.32)}
.punch-btn .lab{font-size:17px;font-weight:600;opacity:.92}
.punch-btn .time{font-size:42px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05}
.pbar{position:absolute;left:20px;right:20px;bottom:12px;height:5px;border-radius:5px;background:rgba(255,255,255,.22);overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:5px;background:#7dffb0}
@media (prefers-reduced-motion:no-preference){
  .pbar i{transition:width 1s linear}
  .punch-btn{transition:transform .14s ease}
  .punch-btn:active{transform:scale(.985)}
  .punch-btn.pulse{animation:stamp .6s ease-out}
  .sheet.enter{animation:up .42s cubic-bezier(.2,.9,.3,1)}
}
@keyframes stamp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}100%{box-shadow:0 0 0 34px transparent}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

/* mesiac a súčty */
.monthnav{display:flex;align-items:center;justify-content:space-between;border-radius:24px;padding:6px;margin-bottom:14px}
.monthnav .m{font-weight:600;font-size:17px;text-transform:capitalize}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.stat{border-radius:22px;padding:16px}
.stat .lbl{font-size:14px;color:var(--mute);font-weight:500}
.stat .val{white-space:nowrap;font-size:clamp(19px,5.6vw,27px);font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.stat.acc .val{color:var(--atext)}
.stat.wide{grid-column:1/-1}

/* zoznamy */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;min-height:52px;border-top:1px solid var(--line)}
.group>.row:first-child,.group>div:first-child{border-top:0}
.row>span:first-child{color:var(--ink)}
.row .v{color:var(--mute);text-align:right;white-space:nowrap}
.row input,.row select{border:0;background:transparent;text-align:right;width:34%;min-width:0;padding:6px 0;font-weight:600;color:var(--atext);font-size:17px}
.row input[type="color"]{width:56px;height:34px;padding:0;border-radius:10px;cursor:pointer}
.row input[type="file"]{width:100%;font-size:14px;font-weight:500;color:var(--mute);text-align:left}
.rec{padding:14px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.rec:first-child{border-top:0}
.rec .d{font-weight:600}
.rec .t{color:var(--mute);font-size:14px}
.rec .h{font-weight:700;font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.rec .w{color:var(--atext);font-size:14px;text-align:right;font-weight:600}
.x{grid-column:1/-1;justify-self:end;background:transparent;border:0;color:var(--mute);padding:6px 2px 0;min-height:34px;font-size:14px}
.x.sure{color:var(--danger);font-weight:600}
.empty{padding:28px 16px;color:var(--mute);text-align:center}
.note{font-size:13px;color:var(--mute);margin:22px 6px 0}
.topline{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line)}
.filebtn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;border-radius:14px;font-weight:600;font-size:15px;color:var(--atext);background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(244,248,255,.65));border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,0 4px 12px rgba(14,34,80,.1);cursor:pointer}
.filebtn:focus-within{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}

/* spodná lišta */
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:25;width:min(360px,calc(100% - 36px));display:grid;grid-template-columns:repeat(3,1fr);padding:5px;border-radius:32px;--i:0}
#tabs[hidden]{display:none}
#tabs .ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/3);border-radius:27px;background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.7));box-shadow:inset 0 1px 0 #fff,0 4px 14px rgba(14,34,80,.16);transform:translateX(calc(var(--i)*100%));transition:transform .42s cubic-bezier(.3,1.25,.5,1)}
#tabs button{position:relative;background:none;border:0;display:grid;justify-items:center;gap:2px;padding:9px 0 8px;font-size:11px;font-weight:600;color:var(--ink2)}
#tabs button[aria-selected="true"]{color:var(--atext)}
@media (prefers-reduced-motion:reduce){#tabs .ind,.seg .thumb{transition:none}}

/* spodný panel */
.sheet-back{position:fixed;inset:0;z-index:40;background:rgba(11,13,18,.3);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(520px,100%);border-radius:30px 30px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom,0px) + 22px);display:grid;gap:14px}
.sheet h2{margin-bottom:2px}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* úvodná animácia po výbere firmy */
.splash{position:fixed;inset:0;z-index:60;display:grid;place-items:center;clip-path:circle(0 at var(--sx) var(--sy))}
.splash.go{clip-path:circle(150vmax at var(--sx) var(--sy));transition:clip-path .75s cubic-bezier(.7,0,.2,1)}
.splash.out{opacity:0;transition:opacity .5s ease;pointer-events:none}
.splash-in{display:grid;justify-items:center;gap:14px;text-align:center;padding:24px}
.mark{position:relative;width:var(--s);height:var(--s)}
.mark svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring{fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:377;stroke-dashoffset:377}
.head{transform-box:view-box;transform-origin:70px 70px}
.splash.go .ring{animation:draw 1s .55s cubic-bezier(.6,.1,.3,1) forwards}
.splash.go .head{animation:sweep 1s .55s cubic-bezier(.6,.1,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes sweep{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.core{position:absolute;left:22%;top:22%;width:56%;height:56%;border-radius:24%;background:var(--on-accent);color:var(--atext);display:grid;place-items:center;font-weight:700;font-size:44px;letter-spacing:-.03em;opacity:0;transform:scale(.4);overflow:hidden}
.core.img{background:#ffffff}
.core img{width:100%;height:100%;object-fit:contain;padding:8%}
.splash.go .core{animation:pop .5s 1.15s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.splash-name{font-weight:700;font-size:38px;letter-spacing:-.03em;line-height:1;opacity:0;transform:translateY(10px)}
.splash-wm{height:46px;width:auto;opacity:0;transform:translateY(10px)}
.splash-sub{font-size:17px;opacity:0;transform:translateY(10px)}
.splash.go .splash-name,.splash.go .splash-wm{animation:rise .5s 1.35s ease forwards}
.splash.go .splash-sub{animation:rise2 .5s 1.55s ease forwards}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes rise2{to{opacity:.85;transform:none}}

/* úvod: čierny motív a hviezdna obloha */
html.dark,body.dark{background:#000000}
body.dark{color:#ffffff}
body.dark #bg{display:none}
body.dark::before{display:none}
#sky,#skyblue{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none}
body.dark #sky,body.dark #skyblue{display:block}
body.trails #sky{display:block}
#skyblue{background:radial-gradient(ellipse 95% 72% at 50% 44%,var(--sa,#1253c9) 0%,var(--sb,#0a3b92) 30%,var(--sc,#041b4d) 62%,var(--sd,#01040d) 100%);opacity:0;transition:opacity 1.6s ease}
body.blue #skyblue{opacity:1}
#app{position:relative;z-index:1}
#app.fade{animation:fadeIn .5s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.intro{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:max(11vh,44px) 26px max(12vh,52px);transition:opacity .55s ease,transform .55s ease}
.intro.leaving{opacity:0;transform:scale(.97)}
.app-name{font-size:46px;line-height:1.05;font-weight:700;letter-spacing:-.035em;margin:0;text-align:center;color:#ffffff}
.slogan{margin:12px 0 0;text-align:center;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-style:italic;font-size:19px;letter-spacing:.01em;color:rgba(255,255,255,.74)}
.intro-pick{margin-top:max(15vh,48px);margin-bottom:auto}
.pick-lbl{font-size:13px;color:rgba(255,255,255,.55);text-align:center;margin:0 0 14px;letter-spacing:.04em}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{position:relative;overflow:hidden;aspect-ratio:1/.82;border-radius:26px;display:grid;place-items:center;padding:0;border:1px solid rgba(255,255,255,.4)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.5),transparent 44%);opacity:.45;pointer-events:none}
.tile.op{background:linear-gradient(160deg,#ffffff,#dce8ff);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 18px 46px rgba(31,85,214,.5)}
.tile.op img{width:80%;height:auto;display:block}
.tile.billa{background:linear-gradient(160deg,#ffe659,#ffc800);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 18px 46px rgba(255,200,0,.5);cursor:default}
.tile.billa span{font:900 33px/1 "Arial Black",Impact,system-ui,sans-serif;color:#d5101d;letter-spacing:-.01em}
.welcome{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;padding:24px;transition:opacity .5s ease}
.welcome::before{content:"";position:fixed;left:50%;top:48%;width:130vw;height:56vh;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(2,14,48,.62),rgba(2,14,48,.28) 55%,transparent);pointer-events:none;z-index:-1}
.welcome.plain::before{display:none}
.w-logo.plate{width:min(62vw,270px);box-sizing:content-box;padding:12px;background:#ffffff;border-radius:34px;filter:drop-shadow(0 16px 36px rgba(120,80,0,.35))}
.welcome.leave{opacity:0}
.w-logo{width:min(72vw,310px);height:auto;opacity:0;transform:scale(.94);animation:wIn .9s .25s cubic-bezier(.2,.8,.2,1) forwards}
.w-text{margin:30px 0 0;font-size:30px;line-height:1.2;font-weight:500;letter-spacing:-.02em;color:#ffffff;text-shadow:0 2px 22px rgba(2,12,40,.9),0 0 4px rgba(2,12,40,.55);opacity:0;transform:translateY(12px);animation:wUp .8s 1.1s ease forwards}
.w-text b{font-weight:700}
@keyframes wIn{to{opacity:1;transform:none}}
@keyframes wUp{to{opacity:1;transform:none}}

.act{width:min(100%,340px);margin-top:30px;display:grid;gap:12px;justify-items:stretch;opacity:0;transform:translateY(12px);animation:wUp .8s 2.1s ease forwards}
.act-lbl{margin:0;font-size:14px;color:rgba(255,255,255,.82);text-align:center;text-shadow:0 1px 12px rgba(2,12,40,.9)}
.act-box{display:grid;gap:12px}
.act-in{width:100%;min-height:64px;border-radius:20px;border:1px solid rgba(255,255,255,.42);background:rgba(255,255,255,.13);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);color:#ffffff;font:600 30px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;letter-spacing:.4em;text-align:center;padding:0 0 0 .4em;box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 10px 30px rgba(1,10,40,.35)}
.act-in::placeholder{color:rgba(255,255,255,.3)}
.act-in:focus{outline:none;border-color:rgba(255,255,255,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 4px rgba(255,255,255,.16),0 10px 30px rgba(1,10,40,.35)}
.act-btn{min-height:56px;border-radius:19px;border:1px solid rgba(255,255,255,.7);background:#ffffff;color:#000000;font-weight:700;font-size:17px;box-shadow:inset 0 1px 0 #fff,0 12px 28px rgba(1,10,40,.4)}
.act-btn:disabled,.act-in:disabled{opacity:.7;cursor:default}
.act-err{min-height:20px;font-size:14px;color:#ffc2bd;text-align:center;text-shadow:0 1px 10px rgba(2,12,40,.9)}
.act-hint{margin:0;font-size:12px;color:rgba(255,255,255,.55);text-align:center}
.act-cancel{background:none;border:0;color:rgba(255,255,255,.75);font-size:15px;min-height:44px}
.act.ok .act-in{border-color:#8dffbb;color:#b7ffd1}
.act.ok .act-btn{background:linear-gradient(180deg,#d8ffe6,#a5f3c4);color:#0b5a2c}
.act-box.shake{animation:shake .45s ease}
.code-in{width:100%;min-height:66px;border-radius:21px;border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.09);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);color:#ffffff;font:600 22px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.14em;text-align:center;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 48px rgba(255,255,255,.3)}
.code-in::placeholder{color:rgba(255,255,255,.26);letter-spacing:.14em}
.code-in:focus{outline:none;border-color:rgba(255,255,255,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 4px rgba(255,255,255,.16),0 0 56px rgba(255,255,255,.42)}
.code-in:disabled{opacity:.8}
.act-box.ok .code-in{border-color:#8dffbb;color:#b7ffd1;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 48px rgba(80,255,160,.3)}
.act-box.ok .act-btn{background:linear-gradient(180deg,#d8ffe6,#a5f3c4);color:#0b5a2c}
.code-hint{margin:6px 0 0;font-size:13px;line-height:1.5;color:rgba(255,255,255,.55);text-align:center}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){
  #app.fade{animation:none}
  .act{animation:none;opacity:1;transform:none}
  .act-box.shake{animation:none}
  .w-logo,.w-text{animation:none;opacity:1;transform:none}
  #skyblue{transition:none}
}

/* rozvrh smeny */
.bar.static{position:relative;top:auto;width:100%;text-align:left;color:inherit;font:inherit;margin-bottom:12px;cursor:pointer}
.bar.static .chev{margin-left:auto;color:var(--mute);width:18px;height:18px}
.bar-ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 76%,#ffffff),var(--accent));color:var(--on-accent);flex:none}
.bar.static .bar-t{display:grid;min-width:0}
.cal{padding:14px;border-radius:24px}
.cal-h{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-g{display:grid;gap:20px;padding-top:6px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:24px 48px;gap:6px;position:relative}
.wk.nb{grid-template-rows:48px}
.wk .cell{grid-row:2}
.wk.nb .cell{grid-row:1}
.wkb{grid-row:1 / 3;margin:-6px -4px -4px;border-radius:20px;border:1px solid color-mix(in srgb,var(--tint) 30%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--tint) 17%,transparent),color-mix(in srgb,var(--tint) 7%,transparent));box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 6px 18px color-mix(in srgb,var(--tint) 10%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:8px 11px 0;font-size:12px;font-weight:700;color:var(--atext);pointer-events:none;white-space:nowrap;overflow:hidden}
.wkb.P{background:linear-gradient(180deg,color-mix(in srgb,var(--tint) 27%,transparent),color-mix(in srgb,var(--tint) 12%,transparent))}
.wkb.N{background:linear-gradient(180deg,color-mix(in srgb,var(--tint) 40%,transparent),color-mix(in srgb,var(--tint) 20%,transparent));color:var(--atext)}
.wkb .r{font-weight:600;opacity:.8}
.sw.R{background:color-mix(in srgb,var(--tint) 22%,#ffffff)}
.sw.P{background:color-mix(in srgb,var(--tint) 42%,#ffffff)}
.sw.N{background:color-mix(in srgb,var(--tint) 66%,#ffffff)}
.cal-h span{text-align:center;font-size:12px;font-weight:600;color:var(--mute);padding-bottom:8px}
.cell{position:relative;height:48px;min-width:0;border-radius:14px;border:1px solid transparent;background:rgba(255,255,255,.62);display:grid;align-content:center;justify-items:center;padding:0;font-weight:600;font-size:15px}
.cell.empty{visibility:hidden;background:none}
.cell .tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:7px;line-height:1.4}
.t-R{background:color-mix(in srgb,var(--accent) 16%,#ffffff);color:var(--atext)}
.t-P{background:color-mix(in srgb,var(--accent) 40%,#ffffff);color:color-mix(in srgb,var(--accent) 78%,#000000)}
.t-N{background:var(--ink);color:#ffffff}
.t-V{color:var(--mute);background:transparent}
.cell.today{border-color:var(--atext)}
.cell.sel{background:#ffffff;box-shadow:0 6px 16px rgba(14,34,80,.16),inset 0 0 0 2px var(--atext)}
.cell.hol .n{color:var(--danger)}
.cell .hd{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--danger)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:14px 6px 4px;font-size:13px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.dhead{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:22px 6px 10px}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(196,41,29,.1);color:var(--danger)}
.row .v.acc{color:var(--atext);font-weight:700}

/* Billa: animácia skenovania čiarového kódu */
.welcome.scan{place-content:center}
.scanwrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;pointer-events:none}
.bars{display:flex;align-items:center;gap:3px;position:relative}
.sbar{flex:none;height:150px;border-radius:2px;background:rgba(255,255,255,.5);scale:1 0;animation:barIn .5s calc(var(--i) * 16ms + .15s) cubic-bezier(.2,.9,.3,1) forwards,barHit .2s calc(.95s + var(--i) * 26ms) ease forwards,barOut .45s 2.1s cubic-bezier(.6,0,.9,.4) forwards}
@keyframes barIn{to{scale:1 1}}
@keyframes barHit{to{background:#ffffff;box-shadow:0 0 14px rgba(255,255,255,.95)}}
@keyframes barOut{to{transform:scaleY(.04);opacity:0}}
.beam{position:absolute;top:-26px;bottom:-26px;left:-2%;width:4px;border-radius:4px;background:#ffffff;box-shadow:0 0 22px 6px rgba(255,255,255,.95),0 0 60px 14px rgba(255,255,255,.5);opacity:0;animation:sweep 1.07s .95s linear forwards}
@keyframes sweep{0%{left:-2%;opacity:0}6%{opacity:1}94%{opacity:1}100%{left:102%;opacity:0}}
.w-logo.b{width:min(62vw,270px);height:auto;opacity:0;transform:scale(.7);filter:drop-shadow(0 6px 16px rgba(150,80,0,.5));animation:bPop .6s 2.3s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes bPop{to{opacity:1;transform:none}}
.welcome.scan::after{content:"";position:fixed;inset:0;background:#ffffff;opacity:0;pointer-events:none;animation:flash .55s 2.05s ease-out}
@keyframes flash{0%{opacity:0}18%{opacity:.6}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.sbar,.beam,.welcome.scan::after{display:none}.w-logo.b{animation:none;opacity:1;transform:none}}

/* výplatná páska, import, hlásenia */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,12px);opacity:0;z-index:70;background:rgba(11,13,18,.9);color:#ffffff;padding:12px 18px;border-radius:16px;font-size:15px;max-width:calc(100% - 40px);text-align:center;pointer-events:none;transition:opacity .25s ease,transform .25s ease}
.toast.on{opacity:1;transform:translate(-50%,0)}
.pk2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.nrows{display:grid}
.nrow{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px solid rgba(11,13,18,.07);font-size:16px;font-variant-numeric:tabular-nums}
.nrow.sub{padding-left:16px;font-size:14px;color:var(--mute)}
.nrow.big{border-bottom:0;font-size:20px;font-weight:700;color:var(--atext)}
.chart-card{position:relative;overflow:hidden;border-radius:26px;padding:16px 12px 12px;margin-top:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 14%,#ffffff),rgba(255,255,255,.8))}
.chart-head{position:relative;z-index:1;display:flex;align-items:center;gap:12px;margin:0 4px 10px}

.chart-head .cs{font-size:13px;color:var(--mute)}
.chart-wm{position:absolute;right:-18px;bottom:46px;width:160px;opacity:.07;pointer-events:none}
.chart-svg{display:block}
.chart-wrap{position:relative;z-index:1;display:flex}
.chart-axis{flex:none}
.chart-scroll{flex:1;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}

.cpill{fill:var(--accent)}

.csel{fill:none;stroke:var(--accent);stroke-width:1.4}
.chit{fill:transparent;cursor:pointer}
.chart-legend{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 4px 0;font-size:12px;color:var(--mute)}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}

var MIN = 60000;
function isNight(h, od, dod){
  if (od > dod) return h >= od || h < dod;
  return h >= od && h < dod;
}
function startOf(d, mode){
  var t = Math.floor(d.getTime() / MIN) * MIN;
  if (mode !== 'stvrt' || d.getMinutes() === 0) return t;
  var b = 15 * MIN;
  return (Math.ceil(t / b) - 1) * b;
}
function breaksOf(R){
  var a = [];
  if (R.b1min > 0) a.push({ od:R.b1od, po:R.b1po, min:R.b1min });
  if (R.b2min > 0) a.push({ od:R.b2od, po:R.b2po, min:R.b2min });
  return a;
}
function calc(rec, R){
  if (!rec.o) return { hours:0, wage:0 };
  var start = startOf(new Date(rec.p), R.zaokruhlenie);
  var end = new Date(rec.o).getTime();
  if (end <= start) return { hours:0, wage:0 };
  var lenMin = (end - start) / MIN;
  var brk = breaksOf(R).filter(function(b){ return lenMin >= b.od; });
  var t = start, paid = 0, wage = 0;
  var holArr = !!holidayName(new Date(start));
  var arrDay = new Date(start).getDay();
  while (t < end){
    var step = Math.min(MIN, end - t);
    var share = step / MIN;
    var el = (t - start) / MIN;
    var onBreak = brk.some(function(b){ return el >= b.po * 60 && el < b.po * 60 + b.min; });
    if (onBreak){ t += step; continue; }
    var d = new Date(t);
    var day = R.dayByArrival ? arrDay : d.getDay();
    var weekend = (day === 0 || day === 6);
    var add = 0, ot = 0;
    if (isNight(d.getHours(), R.nocOd, R.nocDo)) add += R.pNoc;
    if (day === 6) add += R.pSobota;
    if (day === 0) add += R.pNedela;
    var wk = (day === 6 ? R.pSobota : (day === 0 ? R.pNedela : 0));
    if (holArr) add += (R.pSviatok || 0) + (R.sadzba + wk) * (R.pSviatokPct || 0) / 100;
    if ((!weekend || R.nadcasVikend) && el >= R.nadcasPo * 60) ot = R.pNadcas;
    wage += (R.sadzba * (1 + ot / 100) + add) / 60 * share;
    paid += share;
    t += step;
  }
  return { hours: paid / 60, wage: wage };
}

function easter(y){
  var a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
  var f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  var h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
  var l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  var mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mo - 1, da);
}
function ymd(d){ return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
var holCache = {};
function holidaysOf(y){
  if (holCache[y]) return holCache[y];
  var h = {};
  function add(m, d, n){ h[y + '-' + p2(m) + '-' + p2(d)] = n; }
  add(1,1,'Deň vzniku Slovenskej republiky'); add(1,6,'Zjavenie Pána (Traja králi)');
  add(5,1,'Sviatok práce'); add(5,8,'Deň víťazstva nad fašizmom');

  add(11,1,'Sviatok všetkých svätých'); add(11,17,'Deň boja za slobodu a demokraciu');
  add(12,24,'Štedrý deň'); add(12,25,'Prvý sviatok vianočný'); add(12,26,'Druhý sviatok vianočný');
  var e = easter(y);
  h[ymd(new Date(e.getFullYear(), e.getMonth(), e.getDate() - 2))] = 'Veľký piatok';
  h[ymd(new Date(e.getFullYear(), e.getMonth(), e.getDate() + 1))] = 'Veľkonočný pondelok';
  holCache[y] = h;
  return h;
}
function holidayName(d){ return holidaysOf(d.getFullYear())[ymd(d)] || null; }

// Ukážkový rozvrh: v skutočnej verzii ho dodá zamestnávateľ
var SHIFTS = { R:{ n:'Ranná', f:6, t:14 }, P:{ n:'Poobedná', f:14, t:22 }, N:{ n:'Nočná', f:22, t:6 } };
// Týždenné striedanie smien (pondelok až piatok): nočná, ranná, poobedná, potom odznova
function weekType(d){
  var dow = (d.getDay() + 6) % 7;
  var mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow);
  var wk = Math.round((Date.UTC(mon.getFullYear(), mon.getMonth(), mon.getDate()) - Date.UTC(2026, 10, 2)) / 604800000);
  return ['N','R','P'][((wk % 3) + 3) % 3];
}
function shiftTypeFor(d){
  var dow = (d.getDay() + 6) % 7;
  return dow >= 5 ? 'V' : weekType(d);
}
function shiftTimes(d){
  var t = shiftTypeFor(d);
  if (t === 'V') return null;
  var sh = SHIFTS[t];
  var st = new Date(d.getFullYear(), d.getMonth(), d.getDate(), sh.f, 0);
  var en = new Date(d.getFullYear(), d.getMonth(), d.getDate(), sh.t, 0);
  if (sh.t <= sh.f) en.setDate(en.getDate() + 1);
  return { type:t, name:sh.n, start:st, end:en };
}
function shiftFlags(sh, R){
  var f = { noc:false, sob:false, ned:false, sv:[], ot:false };
  var hn0 = holidayName(sh.start);
  if (hn0) f.sv.push(hn0);
  var t = sh.start.getTime(), end = sh.end.getTime();
  while (t < end){
    var d = new Date(t);
    var wd = R.dayByArrival ? sh.start.getDay() : d.getDay();
    if (isNight(d.getHours(), R.nocOd, R.nocDo)) f.noc = true;
    if (wd === 6) f.sob = true;
    if (wd === 0) f.ned = true;
    if ((wd !== 0 && wd !== 6 || R.nadcasVikend) && (t - sh.start.getTime()) / MIN >= R.nadcasPo * 60) f.ot = true;
    t += 15 * MIN;
  }
  return f;
}

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function onColor(hex){
  var h = hex.replace('#','');
  if (h.length === 3) h = h.split('').map(function(c){ return c + c; }).join('');
  var r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  var lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return lum > 0.62 ? '#14161a' : '#ffffff';
}

var REDUCE = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
var SKY = { cv: document.getElementById('sky'), ctx: null, w: 0, h: 0, dpr: 1, stars: null,
  rot: 0, last: 0, running: false,
  speed: 0.03, tSpeed: 0.03, len: 0.5, tLen: 0.5, br: 0, tBr: 0,
  h0: 205, hr: 30, l0: 78, lr: 20, sat: 85, cyf: 0.44, count: 260, cur: null };
function skyResize(){
  SKY.dpr = Math.min(window.devicePixelRatio || 1, 2);
  SKY.w = window.innerWidth; SKY.h = window.innerHeight;
  SKY.cv.width = Math.round(SKY.w * SKY.dpr);
  SKY.cv.height = Math.round(SKY.h * SKY.dpr);
}
function skySetup(){
  SKY.ctx = SKY.cv.getContext('2d');
  skyResize();
  var a = [];
  for (var i = 0; i < 260; i++){
    a.push({ r: Math.pow(Math.random(), 0.75), a0: Math.random() * Math.PI * 2,
      l: 0.25 + Math.random() * 0.95, w: 0.5 + Math.random() * 1.5, b: 0.35 + Math.random() * 0.65,
      hu: Math.random(), li: Math.random() });
  }
  SKY.stars = a;
}
function skyDraw(){
  var c = SKY.ctx, d = SKY.dpr;
  c.clearRect(0, 0, SKY.cv.width, SKY.cv.height);
  var cx = SKY.w * 0.5 * d, cy = SKY.h * SKY.cyf * d;
  var maxR = Math.sqrt(SKY.w * SKY.w + SKY.h * SKY.h) * 0.62 * d;
  c.lineCap = 'round';
  var n = Math.min(SKY.count, SKY.stars.length);
  for (var i = 0; i < n; i++){
    var s = SKY.stars[i];
    var start = s.a0 + SKY.rot;
    c.beginPath();
    c.arc(cx, cy, s.r * maxR + 14 * d, start, start + s.l * SKY.len);
    c.strokeStyle = 'hsla(' + (SKY.h0 + s.hu * SKY.hr).toFixed(0) + ',' + SKY.sat + '%,' + (SKY.l0 + s.li * SKY.lr).toFixed(0) + '%,' + (s.b * SKY.br).toFixed(3) + ')';
    c.lineWidth = s.w * d;
    c.stroke();
  }
}
function skyFrame(ts){
  if (!SKY.running) return;
  var dt = Math.min(0.05, (ts - SKY.last) / 1000 || 0.016);
  SKY.last = ts;
  var k = Math.min(1, dt * 2.2);
  SKY.speed += (SKY.tSpeed - SKY.speed) * k;
  SKY.len += (SKY.tLen - SKY.len) * k;
  SKY.br += (SKY.tBr - SKY.br) * k;
  SKY.rot += SKY.speed * dt;
  skyDraw();
  requestAnimationFrame(skyFrame);
}
function skyLogin(){
  var f = FIRMS[S.selected] || FIRMS.moja;
  var t = f.login;
  var first = SKY.cur !== 'login';
  SKY.h0 = t.h0; SKY.hr = t.hr; SKY.l0 = t.l0; SKY.lr = t.lr; SKY.sat = t.sat; SKY.cyf = t.cy; SKY.count = t.n;
  if (first){ SKY.br = 0; }
  skyStart();
  skyMode('login');
}
function skyStart(){
  if (SKY.running) return;
  if (!SKY.stars) skySetup();
  if (REDUCE){ skyDraw(); return; }
  SKY.running = true;
  SKY.last = performance.now();
  requestAnimationFrame(skyFrame);
}
function skyStop(){
  SKY.running = false;
  SKY.speed = SKY.tSpeed = 0.03; SKY.len = SKY.tLen = 0.5; SKY.br = SKY.tBr = 0;
  SKY.count = 260; SKY.cur = null;
  if (SKY.ctx) SKY.ctx.clearRect(0, 0, SKY.cv.width, SKY.cv.height);
}
function skyTheme(t){
  SKY.h0 = t.h0; SKY.hr = t.hr; SKY.l0 = t.l0; SKY.lr = t.lr; SKY.sat = t.sat; SKY.cyf = t.cy; SKY.count = 260;
  var b = document.getElementById('skyblue');
  b.style.setProperty('--sa', t.a); b.style.setProperty('--sb', t.b);
  b.style.setProperty('--sc', t.c); b.style.setProperty('--sd', t.d);
}
function skyMode(m){
  var P = { idle:[0.03, 0.5, 0], spin:[1.1, 1.5, 1.0], calm:[0.16, 1.5, 0.95], login:[0.045, 1.1, 0.62] }[m];
  SKY.cur = m;
  SKY.tSpeed = P[0]; SKY.tLen = P[1]; SKY.tBr = P[2];
  if (REDUCE){
    SKY.speed = P[0]; SKY.len = P[1]; SKY.br = P[2];
    if (SKY.stars) skyDraw();
  }
}

function viewMain(){
  var prof = getProfile(S.session.profileId);
  var R = prof.rules;
  var isBr = S.session.type === 'brigadnik';
  var recs = loadRecs();
  var y = S.month.getFullYear(), m = S.month.getMonth();
  var items = [];
  recs.forEach(function(r, i){
    var d = new Date(r.p);
    if (d.getFullYear() === y && d.getMonth() === m) items.push({ r:r, i:i });
  });
  var hours = 0, wage = 0;
  items.forEach(function(x){ x.c = calc(x.r, R); hours += x.c.hours; wage += x.c.wage; });

  var last = recs[recs.length - 1];
  var onShift = !!last && !last.o;
  S.shiftStart = onShift ? new Date(last.p) : null;

function viewChart(){
  var prof = getProfile(S.session.profileId), R = prof.rules;
  var isBr = S.session.type === 'brigadnik';
  var y = S.month.getFullYear(), m = S.month.getMonth();
  var days = new Date(y, m + 1, 0).getDate();
  var mStart = new Date(y, m, 1).getTime(), mEnd = new Date(y, m + 1, 1).getTime();
  var segs = [], touch = {};
  var nSh = 0, paid = 0, longest = 0, longestD = null;
  var dayHours = {};
  function cut(t0, t1, kind){
    var t = t0;
    while (t < t1){
      var d0 = new Date(t);
      var next = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + 1).getTime();
      var e = Math.min(t1, next);
      if (d0.getFullYear() === y && d0.getMonth() === m){
        var a = d0.getHours() + d0.getMinutes() / 60 + d0.getSeconds() / 3600;
        segs.push({ d: d0.getDate(), a: a, b: Math.min(24, a + (e - t) / 3600000), k: kind });
      }
      t = e;
    }
  }
  loadRecs().forEach(function(r){
    if (!r.o) return;
    var p = new Date(r.p), o = new Date(r.o);
    var ps = p.getTime(), os = o.getTime();
    if (os <= mStart || ps >= mEnd || os <= ps) return;
    var h = p.getHours();
    var kind = (h >= 4 && h < 12) ? 'R' : ((h >= 12 && h < 20) ? 'P' : 'N');
    cut(ps, os, kind);
    var st = startOf(p, R.zaokruhlenie);
    var lenMin = (os - st) / MIN;
    breaksOf(R).forEach(function(b){
      if (lenMin >= b.od) cut(st + b.po * 60 * MIN, st + (b.po * 60 + b.min) * MIN, 'brk');
    });
    var c = calc(r, R);
    var sum = { p: p, o: o, c: c };
    var dd = new Date(Math.max(ps, mStart));
    dd = new Date(dd.getFullYear(), dd.getMonth(), dd.getDate());
    while (dd.getTime() < os && dd.getTime() < mEnd){
      (touch[dd.getDate()] = touch[dd.getDate()] || []).push(sum);
      dd = new Date(dd.getFullYear(), dd.getMonth(), dd.getDate() + 1);
    }
    if (p.getFullYear() === y && p.getMonth() === m){
      nSh++; paid += c.hours;
      dayHours[p.getDate()] = (dayHours[p.getDate()] || 0) + c.hours;
      if (c.hours > longest){ longest = c.hours; longestD = p; }
    }
  });

  var CW = 24, PL = 40, PT = 12, PH = 230;
  var LBL = PT + PH, H = LBL + 52, PW = days * CW;
  function X(d){ return (d - 1) * CW; }
  function Y(hh){ return PT + PH * (1 - hh / 24); }
  var WDS = ['Ne', 'Po', 'Ut', 'St', 'Št', 'Pi', 'So'];
  function hs(x){ return (Math.round(x * 10) / 10).toString().replace('.', ','); }

  var axis = '<svg class="chart-axis chart-svg" width="' + PL + '" height="' + H + '" aria-hidden="true">';
  [0, 6, 12, 18, 24].forEach(function(hh){
    axis += '<text x="' + (PL - 6) + '" y="' + (Y(hh) + 3).toFixed(1) + '" text-anchor="end" font-size="9">' + hh + ':00</text>';
  });
  axis += '<text x="' + (PL - 6) + '" y="' + (LBL + 16) + '" text-anchor="end" font-size="9">deň</text>' +
    '<text x="' + (PL - 6) + '" y="' + (LBL + 45) + '" text-anchor="end" font-size="9">hod.</text></svg>';

  var svg = '<svg class="chart-plot chart-svg" width="' + PW + '" height="' + H + '" role="img" aria-label="Graf odpracovaných hodín po dňoch">';
  for (var d = 1; d <= days; d++){
    var wd0 = new Date(y, m, d).getDay();
    if (wd0 === 0 || wd0 === 6) svg += '<rect class="cwk" x="' + X(d) + '" y="' + PT + '" width="' + CW + '" height="' + (H - PT - 2) + '" rx="6"/>';
  }
  [0, 6, 12, 18, 24].forEach(function(hh){
    svg += '<line class="cgrid" x1="0" x2="' + PW + '" y1="' + Y(hh).toFixed(1) + '" y2="' + Y(hh).toFixed(1) + '"/>';
  });
  var bw = CW * 0.6, bx = (CW - bw) / 2;
  function bar(sg){
    var x = X(sg.d) + bx, yt = Y(sg.b), hh = Y(sg.a) - Y(sg.b);
    if (hh < 0.6) return '';
    return '<rect class="' + (sg.k === 'brk' ? 'cb-brk' : 'cb cb-' + sg.k) + '" x="' + x.toFixed(1) + '" y="' + yt.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hh.toFixed(1) + '" rx="4"/>';
  }
  segs.filter(function(g){ return g.k !== 'brk'; }).forEach(function(g){ svg += bar(g); });
  segs.filter(function(g){ return g.k === 'brk'; }).forEach(function(g){ svg += bar(g); });
  var todayD = new Date();
  var worked = [];
  for (var d2 = 1; d2 <= days; d2++){
    var dt = new Date(y, m, d2), w2 = dt.getDay();
    var cx = X(d2) + CW / 2;
    var wk = (w2 === 0 || w2 === 6);
    var hol = !!holidayName(dt);
    var did = dayHours[d2] !== undefined;
    if (did) worked.push(d2);
    if (did) svg += '<rect class="cpill" x="' + (cx - 10) + '" y="' + (LBL + 4) + '" width="20" height="16" rx="8"/>';
    var isToday = dt.getFullYear() === todayD.getFullYear() && dt.getMonth() === todayD.getMonth() && dt.getDate() === todayD.getDate();
    if (isToday && !did) svg += '<rect class="ctoday" x="' + (cx - 10) + '" y="' + (LBL + 4) + '" width="20" height="16" rx="8"/>';
    svg += '<text x="' + cx + '" y="' + (LBL + 16) + '" text-anchor="middle" font-size="11" font-weight="700" style="fill:' + (did ? 'var(--on-accent)' : (hol ? 'var(--danger)' : '#2b3140')) + '">' + d2 + '</text>' +
      '<text x="' + cx + '" y="' + (LBL + 31) + '" text-anchor="middle" font-size="9"' + (wk || hol ? ' font-weight="700"' : '') + (hol ? ' style="fill:var(--danger)"' : '') + '>' + WDS[w2] + '</text>';
    if (did) svg += '<text x="' + cx + '" y="' + (LBL + 46) + '" text-anchor="middle" font-size="9.5" font-weight="700" style="fill:var(--atext)">' + hs(dayHours[d2]) + '</text>';
  }
  if (S.chartSel){
    svg += '<rect class="csel" x="' + (X(S.chartSel) + 1) + '" y="' + PT + '" width="' + (CW - 2) + '" height="' + (H - PT - 2) + '" rx="6"/>';
  }
  for (var d3 = 1; d3 <= days; d3++){
    svg += '<rect class="chit" data-act="cday" data-d="' + d3 + '" x="' + X(d3) + '" y="' + PT + '" width="' + CW + '" height="' + (H - PT) + '"/>';
  }
  if (!nSh && !segs.length) svg += '<text x="150" y="' + (PT + PH / 2) + '" text-anchor="middle" font-size="12">V tomto mesiaci zatiaľ nie sú záznamy</text>';
  svg += '</svg>';
  var focusDay = S.chartSel || worked[0] || 1;
  var wrap = '<div class="chart-wrap">' + axis + '<div class="chart-scroll" data-focus="' + (X(focusDay) + CW / 2) + '">' + svg + '</div></div>';
  var workedTxt = worked.length ? worked.map(function(x){ return x + '.'; }).join(' ') : '–';

  var lg = safeUrl(prof.logo);
  var wm = lg ? '<img class="chart-wm" src="' + lg + '" alt="">' : '';
  var legend = '<div class="chart-legend"><span><i class="lg-R"></i>Ranná</span><span><i class="lg-P"></i>Poobedná</span><span><i class="lg-N"></i>Nočná</span>' +
    '<span><i style="background:#ffffff"></i>Prestávka</span><span><i style="background:var(--danger);border:0;border-radius:50%"></i>Sviatok</span></div>';

  var stats = '<div class="cards" style="margin-top:14px">' +
    '<div class="stat glass"><div class="lbl">Smeny</div><div class="val">' + nSh + '</div></div>' +
    '<div class="stat glass acc"><div class="lbl">Odpracované</div><div class="val">' + fmtHM(paid) + '</div></div>' +
    '<div class="stat glass"><div class="lbl">Priemer na smenu</div><div class="val">' + (nSh ? fmtHM(paid / nSh) : '–') + '</div></div>' +
    '<div class="stat glass"><div class="lbl">Najdlhšia' + (longestD ? ' · ' + longestD.getDate() + '. ' + (longestD.getMonth() + 1) + '.' : '') + '</div><div class="val">' + (nSh ? fmtHM(longest) : '–') + '</div></div></div>';

  var detail;
  var sel = S.chartSel;
  if (sel && touch[sel] && touch[sel].length){
    var dd2 = new Date(y, m, sel);
    detail = '<div class="dhead"><h2>' + WDL[dd2.getDay()] + ' ' + sel + '. ' + (m + 1) + '.</h2></div><div class="glass group">' +
      touch[sel].map(function(t){
        var plus = t.o.toDateString() !== t.p.toDateString() ? ' (+1 deň)' : '';
        return '<div class="row"><span>' + fmtD(t.p) + ' · ' + fmtT(t.p) + ' – ' + fmtT(t.o) + plus + '</span><span class="v">' + fmtHM(t.c.hours) + (isBr ? ' · ' + money(t.c.wage) + ' €' : '') + '</span></div>';
      }).join('') + '</div>';
  } else if (sel){
    detail = '<div class="dhead"><h2>' + WDL[new Date(y, m, sel).getDay()] + ' ' + sel + '. ' + (m + 1) + '.</h2></div><div class="glass group"><div class="row"><span>Voľno</span><span class="v">–</span></div></div>';
  } else {
    detail = '<p class="note">Ťukni na stĺpec a uvidíš detail dňa. Smena cez polnoc sa zobrazí na oboch dňoch.</p>';
  }

  return '<main class="wrap">' +
    '<div class="topline"><button class="ibtn" data-act="chartBack" aria-label="Späť">' + icon('left') + '</button><h2>Graf hodín</h2></div>' +
    '<div style="margin-top:14px">' + monthNav() + '</div>' +
    '<section class="glass chart-card">' + wm +
    '<div class="chart-head">' + logoHTML(prof, 'sm') + '<div><div class="ct">Kedy a koľko si pracoval</div><div class="cs">' + esc(prof.name) + ' · ' + esc(monthName()) + '</div></div></div>' +
    wrap + legend + '<p class="cap">Posúvaj do strán. Os X: dni v mesiaci, pod dňom sú odpracované hodiny. Os Y: hodina dňa.</p>' +
    '<p class="cap"><b>Odpracované dni (' + worked.length + '):</b> ' + workedTxt + '</p></section>' +
    stats + detail + '</main>';
}

function viewSchedule(){
  var prof = getProfile(S.session.profileId), R = prof.rules;
  var isBr = S.session.type === 'brigadnik';
  var y = S.month.getFullYear(), m = S.month.getMonth();
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var sel = S.selDay ? new Date(S.selDay.getFullYear(), S.selDay.getMonth(), S.selDay.getDate()) : today;
  if (sel.getFullYear() !== y || sel.getMonth() !== m){
    sel = (today.getFullYear() === y && today.getMonth() === m) ? today : new Date(y, m, 1);
    S.selDay = sel;
  }
  var lead = (new Date(y, m, 1).getDay() + 6) % 7;
  var days = new Date(y, m + 1, 0).getDate();
  var cells = '';
  for (var w = 1 - lead; w <= days; w += 7){
    var type = weekType(new Date(y, m, w));
    var vis = [];
    var html = '';
    for (var c = 0; c < 7; c++){
      var dt = new Date(y, m, w + c);
      if (dt.getMonth() !== m){
        html += '<span class="cell empty" style="grid-column:' + (c + 1) + '"></span>';
        continue;
      }
      if (c < 5) vis.push(c);
      var hol = holidayName(dt);
      var cls = 'cell' + (dt.getTime() === today.getTime() ? ' today' : '') + (dt.getTime() === sel.getTime() ? ' sel' : '') + (hol ? ' hol' : '');
      html += '<button class="' + cls + '" style="grid-column:' + (c + 1) + '" data-act="day" data-d="' + ymd(dt) + '" aria-label="' + dt.getDate() + '. ' + (m + 1) + '.' + (hol ? ', sviatok' : '') + '">' +
        '<span class="n">' + dt.getDate() + '</span>' + (hol ? '<i class="hd"></i>' : '') + '</button>';
    }
    var blk = '';
    if (type !== 'V' && vis.length){
      var c0 = vis[0], c1 = vis[vis.length - 1], span = c1 - c0 + 1;
      var shf = SHIFTS[type];
      var dA = new Date(y, m, w + c0), dB = new Date(y, m, w + c1);
      var range = dA.getDate() === dB.getDate() ? dA.getDate() + '. ' + (m + 1) + '.' : dA.getDate() + '.–' + dB.getDate() + '. ' + (m + 1) + '.';
      var lab;
      if (span >= 5) lab = '<span>' + shf.n + ' · ' + shf.f + ':00–' + shf.t + ':00</span><span class="r">' + range + '</span>';
      else if (span >= 3) lab = '<span>' + shf.n + '</span><span class="r">' + range + '</span>';
      else if (span === 2) lab = '<span>' + shf.n + '</span>';
      else lab = '<span>' + type + '</span>';
      blk = '<div class="wkb ' + type + '" style="grid-column:' + (c0 + 1) + ' / ' + (c1 + 2) + '">' + lab + '</div>';
    }
    cells += '<div class="wk' + (blk ? '' : ' nb') + '">' + blk + html + '</div>';
  }
  var head = ['Po','Ut','St','Št','Pi','So','Ne'].map(function(x){ return '<span>' + x + '</span>'; }).join('');

  var sh = shiftTimes(sel);
  var hol2 = holidayName(sel);
  var detail = '';
  if (!sh){
    detail = '<div class="row"><span>Smena</span><span class="v">Voľno</span></div>';
  } else {
    var c = calc({ p: sh.start.toISOString(), o: sh.end.toISOString() }, R);
    var fl = shiftFlags(sh, R);
    var plus = sh.end.toDateString() !== sh.start.toDateString() ? ' (+1 deň)' : '';
    detail = '<div class="row"><span>Smena</span><span class="v">' + esc(sh.name) + '</span></div>' +
      '<div class="row"><span>Od – do</span><span class="v">' + fmtT(sh.start) + ' – ' + fmtT(sh.end) + plus + '</span></div>' +
      '<div class="row"><span>Platený čas</span><span class="v">' + fmtHM(c.hours) + '</span></div>' +
      (isBr ? '<div class="row"><span>Odhad mzdy</span><span class="v acc">' + money(c.wage) + ' €</span></div>' : '');
    var sur = [];
    if (fl.noc) sur.push(['Noc ' + R.nocOd + ':00 – ' + R.nocDo + ':00', '+' + money(R.pNoc) + ' € / h']);
    if (fl.sob) sur.push(['Sobota', '+' + money(R.pSobota) + ' € / h']);
    if (fl.ned) sur.push(['Nedeľa', '+' + money(R.pNedela) + ' € / h']);
    fl.sv.forEach(function(n){
      var parts = [];
      if ((R.pSviatokPct || 0) > 0) parts.push('+' + R.pSviatokPct + ' %');
      if ((R.pSviatok || 0) > 0) parts.push('+' + money(R.pSviatok) + ' € / h');
      sur.push(['Sviatok: ' + n, parts.length ? parts.join(' · ') : 'bez príplatku']);
    });
    if (fl.ot) sur.push(['Nadčas po ' + R.nadcasPo + ' h', '+' + R.pNadcas + ' %']);
    var surHtml = sur.length
      ? sur.map(function(r){ return '<div class="row"><span>' + esc(r[0]) + '</span><span class="v acc">' + esc(r[1]) + '</span></div>'; }).join('')
      : '<div class="row"><span>Bez príplatkov</span><span class="v">–</span></div>';
    detail += '</div><h3 class="sec">Príplatky v tento deň</h3><div class="glass group">' + surHtml;
  }

  return '<main class="wrap">' +
    '<div class="topline"><button class="ibtn" data-act="schedBack" aria-label="Späť">' + icon('left') + '</button><h2>Rozvrh smeny</h2></div>' +
    '<div style="margin-top:14px">' + monthNav() + '</div>' +
    '<div class="glass cal"><div class="cal-h">' + head + '</div><div class="cal-g">' + cells + '</div></div>' +
    '<div class="legend"><span><i class="sw R"></i>Ranná ' + SHIFTS.R.f + '–' + SHIFTS.R.t + '</span><span><i class="sw P"></i>Poobedná ' + SHIFTS.P.f + '–' + SHIFTS.P.t + '</span>' +
    '<span><i class="sw N"></i>Nočná ' + SHIFTS.N.f + '–' + SHIFTS.N.t + '</span><span><i style="background:var(--danger)"></i>Sviatok</span></div>' +
    '<div class="dhead"><h2>' + WDL[sel.getDay()] + ' ' + sel.getDate() + '. ' + (sel.getMonth() + 1) + '.</h2>' +

var ODV = { nepodlieha:200, inv:3, sta:4, nem:1.4, nez:1, zdr:5, nczd:497.23, dan:19 };
function r2(x){ return Math.round(x * 100) / 100; }
function netBrigadnik(g){
  var base = Math.max(0, g - ODV.nepodlieha);
  var inv = r2(base * ODV.inv / 100), sta = r2(base * ODV.sta / 100);
  var od = r2(inv + sta);
  var zd = r2(Math.max(0, g - od - ODV.nczd));
  var dan = r2(zd * ODV.dan / 100);
  return { lines: [['Invalidné poistenie (3 %)', inv], ['Starobné poistenie (4 %)', sta]], od: od, zd: zd, dan: dan, net: r2(g - od - dan) };
}
function netZamestnanec(g){
  var nem = r2(g * ODV.nem / 100), sta = r2(g * ODV.sta / 100), inv = r2(g * ODV.inv / 100);
  var nez = r2(g * ODV.nez / 100), zdr = r2(g * ODV.zdr / 100);
  var od = r2(nem + sta + inv + nez + zdr);
  var zd = r2(Math.max(0, g - od - ODV.nczd));
  var dan = r2(zd * ODV.dan / 100);
  return { lines: [['Nemocenské poistenie (1,4 %)', nem], ['Starobné poistenie (4 %)', sta], ['Invalidné poistenie (3 %)', inv],
                   ['Poistenie v nezamestnanosti (1 %)', nez], ['Zdravotné poistenie (5 %)', zdr]], od: od, zd: zd, dan: dan, net: r2(g - od - dan) };
}
function netOf(g, isBr){ return isBr ? netBrigadnik(g) : netZamestnanec(g); }
function netCard(g, isBr){

function parseImport(t){
  t = String(t).trim();
  var out = [], bad = 0;
  if (t.charAt(0) === '[' || t.charAt(0) === '{'){
    var a;
    try { a = JSON.parse(t); } catch (e) { return { recs:[], bad:1, err:true }; }
    if (!Array.isArray(a)) a = [a];
    a.forEach(function(r){
      var dp = new Date(r.prichod || r.p);
      var od = (r.odchod || r.o) ? new Date(r.odchod || r.o) : null;
      if (isNaN(dp) || (od && isNaN(od))){ bad++; return; }
      out.push({ p: dp.toISOString(), o: od ? od.toISOString() : null });
    });
    return { recs: out, bad: bad };
  }
  t.split(/\r?\n/).forEach(function(line){
    line = line.trim();
    if (!line) return;
    var m = line.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})[\s,;]+(\d{1,2}):(\d{2})[\s,;\u2013\-]+(\d{1,2}):(\d{2})$/);
    if (!m){ bad++; return; }
    var y = +m[3], mo = +m[2] - 1, d = +m[1];
    var st = new Date(y, mo, d, +m[4], +m[5]);
    var en = new Date(y, mo, d, +m[6], +m[7]);
    if (en <= st) en.setDate(en.getDate() + 1);
    out.push({ p: st.toISOString(), o: en.toISOString() });
  });
  return { recs: out, bad: bad };
}
function doImport(){
  var ta = document.getElementById('imp');
  var msg = document.getElementById('imp-msg');
  if (!ta || !msg) return;
  var res = parseImport(ta.value);
  if (res.err){ msg.textContent = 'Text sa nepodarilo prečítať ako JSON.'; return; }
  if (!res.recs.length){ msg.textContent = 'Nenašiel som žiadne záznamy.' + (res.bad ? ' Neprečítané riadky: ' + res.bad + '.' : ''); return; }
  var cur = loadRecs(), added = 0, latest = 0;
  res.recs.forEach(function(r){
    var t = new Date(r.p).getTime();
    var dup = cur.some(function(x){ return new Date(x.p).getTime() === t; });
    if (!dup){ cur.push(r); added++; }
    if (t > latest) latest = t;
  });
  saveRecs(cur);
  var ld = new Date(latest);
  S.month = new Date(ld.getFullYear(), ld.getMonth(), 1);
  S.tab = 'list';
  toast('Importovaných ' + added + ' záznamov' + (res.bad ? ', neprečítaných ' + res.bad : '') + '.');
  render();
}

async function renderReport(prof, rows, tot, isBr, y, m){

function makePdf(pages){

  obj(1, function(){ put('<< /Type /Catalog /Pages 2 0 R >>'); });
  obj(2, function(){ put('<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + pages.length + ' >>'); });
  pages.forEach(function(pg, i){

    obj(pn, function(){ put('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ' + im + ' 0 R >> >> /Contents ' + cn + ' 0 R >>'); });
    var content = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';

    obj(im, function(){

      put(pg.bytes);
      put('\nendstream');
    });
  });
  var total = 3 + 3 * pages.length;
  var xref = len;
  var x = 'xref\n0 ' + total + '\n0000000000 65535 f \n';
  for (var k = 1; k < total; k++) x += String(offs[k]).padStart(10, '0') + ' 00000 n \n';
  x += 'trailer\n<< /Size ' + total + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF';

async function buildReportPdf(){

  var isBr = S.session.type === 'brigadnik';

  }).sort(function(a, b){ return a.p - b.p; });
  if (!rows.length) return null;

  rows.forEach(function(r){ tot.hours += r.c.hours; tot.wage += r.c.wage; });
  var pages = await renderReport(prof, rows, tot, isBr, y, m);

}
async function exportPdf(){
  var dl = null;
  try { dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  toast('Pripravujem PDF…');
  var res = await buildReportPdf();
  if (!res){ toast('Za tento mesiac nie sú dokončené záznamy.'); return; }
  var name = 'Dochadzka-' + S.month.getFullYear() + '-' + p2(S.month.getMonth() + 1) + '.pdf';
  var blob = new Blob([res.bytes], { type: 'application/pdf' });
  if (dl){
    try { await dl.save({ filename: name, data: blob }); toast('PDF je pripravené.'); }
    catch (e) { if (!e || e.code !== 'declined') toast('PDF sa nepodarilo uložiť.'); }
    return;
  }
  // mimo Claude: zdieľanie cez systémovú ponuku, inak stiahnutie súboru
  try {
    var file = new File([blob], name, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: 'Dochádzka' });
      toast('PDF je pripravené.');
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }
  var url = URL.createObjectURL(blob);
  var an = document.createElement('a');
  an.href = url; an.download = name;
  document.body.appendChild(an); an.click(); an.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
  toast('PDF je pripravené.');
}

function tintOf(hex){
  var h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(function(c){ return c + c; }).join('');
  var r = parseInt(h.substr(0,2),16)/255, g = parseInt(h.substr(2,2),16)/255, b = parseInt(h.substr(4,2),16)/255;
  var mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx + mn) / 2, d = mx - mn, hh = 0, ss = 0;
  if (d){
    ss = d / (1 - Math.abs(2 * l - 1));
    if (mx === r) hh = ((g - b) / d) % 6; else if (mx === g) hh = (b - r) / d + 2; else hh = (r - g) / d + 4;
    hh *= 60; if (hh < 0) hh += 360;
  }
  ss = Math.max(ss, 0.75); l = Math.max(l, 0.5);
  return 'hsl(' + Math.round(hh) + ',' + Math.round(ss * 100) + '%,' + Math.round(l * 100) + '%)';
}
function atextOf(hex){
  var h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(function(c){ return c + c; }).join('');
  var ch = [0, 2, 4].map(function(i){ return parseInt(h.substr(i, 2), 16); });
  var lin = ch.map(function(v){ v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  var L = 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2];
  if (L < 0.3) return hex;
  return 'rgb(' + ch.map(function(v){ return Math.round(v * 0.32); }).join(',') + ')';
}

  var rs = document.documentElement.style;

}

function submitCode(){
  var inp = document.getElementById('code');
  if (!inp || inp.disabled || S.busy) return;
  var now = Date.now();
  var err = document.getElementById('code-err');
  if (now < S.actLock){ err.textContent = 'Príliš veľa pokusov. Skús znova o chvíľu.'; return; }
  var v = inp.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  var pid = CODES[v];
  var box = document.getElementById('code-box');
  if (pid){
    inp.disabled = true;
    var btn = document.getElementById('code-btn');
    btn.disabled = true;
    btn.textContent = 'Kód prijatý ✓';
    box.classList.add('ok');
    err.textContent = '';
    S.busy = true;
    setTimeout(function(){ startFirm(pid); }, REDUCE ? 100 : 550);
  } else {
    S.actFails++;
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    inp.value = '';
    if (S.actFails >= 5){
      S.actFails = 0;
      S.actLock = now + 30000;
      inp.disabled = true;
      err.textContent = 'Príliš veľa pokusov. Skús znova o 30 sekúnd.';
      setTimeout(function(){
        var i2 = document.getElementById('code');
        if (i2) i2.disabled = false;
        var e2 = document.getElementById('code-err');
        if (e2) e2.textContent = '';
      }, 30000);
